<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDGoC CSMU</title>
  <style>
    /* 請複製 index.html 的共用樣式 */
    /* ... 共用 CSS 略 ... */

    .activities-section { padding: 80px 8%; }
    
    /* 兩排排列的 Grid 設定 */
    .activities-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 強制兩欄 */
      gap: 40px; /* 卡片間距 */
    }

    /* 長方形無圓角卡片 */
    .activity-card {
      border: 1px solid var(--border-color);
      border-radius: 0; /* 無圓角 */
      display: flex;
      flex-direction: column;
    }
    
    .activity-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 0; /* 確保圖片也無圓角 */
    }
    
    .activity-info {
      padding: 20px;
      background: #fff;
    }
    
    .activity-date {
      color: var(--text-gray);
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: block;
    }
    
    .activity-title { margin-bottom: 10px; }
  </style>
</head>
<body>
  <!-- Header 導覽列 -->
  <header>
    <div class="logo"><a href="index.html">AI與開源資訊社(´・ω・`)</a></div>
    <nav>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="activities.html" class="active">Activities</a> <!-- active 在這裡 -->
    </nav>
  </header>

  <section class="activities-section">
    <h2 style="margin-bottom: 40px;">Activity Records</h2>
    <div class="activities-grid">
      <!-- 活動 1 -->
      <div class="activity-card">
        <img src="https://picsum.photos/id/1018/600/300" alt="活動照片">
        <div class="activity-info">
          <span class="activity-date">2026-03-15</span>
          <h3 class="activity-title">春季技術論壇</h3>
          <p>邀請業界講師分享最新 AI 發展趨勢。</p>
        </div>
      </div>
      
      <!-- 活動 2 -->
      <div class="activity-card">
        <img src="https://picsum.photos/id/1015/600/300" alt="活動照片">
        <div class="activity-info">
          <span class="activity-date">2026-04-20</span>
          <h3 class="activity-title">黑客松實作營</h3>
          <p>24小時不間斷，從創意發想到 Prototype 實作。</p>
        </div>
      </div>
      
      <!-- 活動 3 -->
      <div class="activity-card">
        <img src="https://picsum.photos/id/1019/600/300" alt="活動照片">
        <div class="activity-info">
          <span class="activity-date">2026-05-10</span>
          <h3 class="activity-title">期中社員大會</h3>
          <p>回顧上半學期成果與下半學期規劃。</p>
        </div>
      </div>
      
      <!-- 活動 4 -->
      <div class="activity-card">
        <img src="https://picsum.photos/id/1025/600/300" alt="活動照片">
        <div class="activity-info">
          <span class="activity-date">2026-06-05</span>
          <h3 class="activity-title">期末專案發表</h3>
          <p>展示這學期各組的實作成果。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer 頁尾 (同 index.html) -->
</body>
</html>

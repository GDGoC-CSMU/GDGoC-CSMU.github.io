<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動 | GDGoC CSMU</title>
<style>
  :root {
    --bg-light: #f8f9fa;
    --heading-dark: #211510;
    --text-gray: #555555;
    --blue-accent: #0073e6;
    --border-color: #e0e0e0;
    --footer-bg: #2b2b2b;
    --footer-text: #f0f0f0;
    --footer-text-muted: #a8a8a8;
    --footer-border: #3f3f3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }

  body { background-color: #ffffff; color: var(--heading-dark); line-height: 1.5; }

  /* ===== Header（沿用原本頁首）===== */
  header {
    position: sticky; top: 0; z-index: 1000;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 8%; border-bottom: 1px solid var(--border-color);
    background: #ffffff;
  }
  .logo a { font-weight: 700; font-size: 1.15rem; letter-spacing: 0.5px; color: var(--heading-dark); text-decoration: none; }
  nav { display: flex; gap: 24px; }
  nav a { text-decoration: none; color: var(--heading-dark); font-size: 0.95rem; font-weight: 500; }
  nav a:hover, nav a.active { color: var(--blue-accent); }

  /* ===== 主要內容：側欄 + 卡片網格 ===== */
  main { padding: 50px 8% 80px; }
  main h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
  main > .page-desc { color: var(--text-gray); margin-bottom: 40px; }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
    align-items: start;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* 分類選單 */
  .sidebar { position: sticky; top: 100px; }
  .sidebar h2 { font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-gray); margin-bottom: 16px; }
  .category-list { display: flex; flex-direction: column; gap: 8px; }
  .category-btn {
    text-align: left; padding: 10px 14px; border: 1px solid var(--border-color);
    background: #fff; cursor: pointer; font-size: 0.92rem; color: var(--heading-dark);
    transition: border-color .2s ease, color .2s ease, background-color .2s ease;
  }
  .category-btn:hover { border-color: var(--blue-accent); color: var(--blue-accent); }
  .category-btn.active { background: var(--heading-dark); border-color: var(--heading-dark); color: #fff; }

  /* 卡片網格 */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 24px;
  }

  .activity-card {
    display: block; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--border-color);
    border-radius: 3px;
    overflow: hidden; cursor: pointer; padding: 0; font: inherit; color: inherit;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .activity-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    border-color: var(--blue-accent);
  }
  .activity-card .card-pic { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #eee; }
  .activity-card .card-pic img { width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .4s ease; }
  .activity-card:hover .card-pic img { transform: scale(1.05); }
  .activity-card .card-body { padding: 14px 16px 18px; }
  .activity-card .card-tag { display: inline-block; font-size: 0.72rem; color: var(--blue-accent);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .activity-card .card-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .activity-card .card-date { font-size: 0.8rem; color: var(--text-gray); }

  /* ===== 詳情彈窗（native <dialog>）===== */
  dialog#detailModal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    border: none; padding: 0; width: min(560px, 90vw);
    max-height: 85vh; overflow-y: auto;
    border-radius: 3px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
  }
  dialog#detailModal::backdrop { background: rgba(15, 10, 8, 0.5); backdrop-filter: blur(3px); }

  .modal-pic { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #eee; }
  .modal-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-body { padding: 28px 30px 30px; position: relative; }
  .modal-close {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    font-size: 1.4rem; cursor: pointer; color: var(--heading-dark); line-height: 1;
  }
  .modal-tag { display: inline-block; font-size: 0.72rem; color: var(--blue-accent);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .modal-body h3 { font-size: 1.4rem; margin-bottom: 10px; }
  .modal-meta { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 16px; }
  .modal-desc { font-size: 0.95rem; line-height: 1.7; margin-bottom: 24px; white-space: pre-line; }
  .btn-signup {
    display: inline-block; padding: 10px 28px; background-color: var(--blue-accent);
    color: #fff; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    text-decoration: none;
  }

  /* ===== 空狀態（尚無資料 / 該分類尚無卡片） ===== */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-gray);
    font-size: 0.95rem;
    padding: 70px 20px;
  }

  /* ===== Footer（全站統一：深灰底、淺色文字） ===== */
  footer {
    background-color: var(--footer-bg); color: var(--footer-text);
    padding: 50px 8% 30px; border-top: 1px solid var(--footer-border); font-size: 0.95rem;
  }
  .footer-main { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 40px; align-items: center; margin-bottom: 50px; }
  .footer-left p { margin-bottom: 6px; }
  .footer-left .footer-address { color: var(--footer-text-muted); font-size: 0.9rem; margin-top: 10px; }

  /* 社群圖示容器（取代原本的 Privacy Policy 等法律連結位置） */
  .footer-center { display: flex; }
  .social-links-row { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .social-links-row a { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .social-links-row img {
    width: 24px; height: 24px; object-fit: contain;
    filter: brightness(0.8) grayscale(100%);
    transition: all 0.2s;
  }
  .social-links-row a:hover img { filter: brightness(1.15) grayscale(0%); }
  /* 圖片載入失敗時（路徑錯誤、檔案被刪除）JS 會加上這個 class 並改顯示文字，避免破圖 */
  .social-links-row a.icon-fallback span {
    color: var(--footer-text); font-size: 0.85rem; font-weight: 600;
  }
  .social-links-row a.icon-fallback:hover span { color: var(--blue-accent); }

  .footer-right { text-align: right; }
  .btn-back-top { background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--footer-text); }
  .footer-copyright { border-top: 1px solid #444444; padding-top: 20px; text-align: center;
    font-size: 0.85rem; color: var(--footer-text-muted); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .category-list { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html">AI與開源資訊社(´・ω・`)</a></div>
    <nav>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="activities.html" class="active">Activities</a>
    </nav>
  </header>

  <main>
    <h1>社團活動</h1>
    <p class="page-desc">探索講座、社群專案與近期活動。</p>

    <div class="layout">
      <aside class="sidebar">
        <div class="category-list" id="categoryList"></div>
      </aside>

      <section class="card-grid" id="cardGrid"></section>
    </div>
  </main>

  <footer id="contact">
    <div class="footer-main">
      <div class="footer-left">
        <p id="footerEmail">dsccsmu@gmail.com</p>
        <p id="footerAddress" class="footer-address">Taichung, Taiwan</p>
      </div>

      <div class="footer-center">
        <div id="social-links-container" class="social-links-row"></div>
      </div>

      <div class="footer-right">
        <button class="btn-back-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">↑</button>
      </div>
    </div>

    <div class="footer-copyright">&copy; 2026 by CSMU GDGoC</div>
  </footer>

  <dialog id="detailModal">
    <div class="modal-pic" id="modalPicWrap"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <button class="modal-close" id="modalClose" aria-label="關閉">&times;</button>
      <span class="modal-tag" id="modalTag"></span>
      <h3 id="modalName"></h3>
      <div class="modal-meta" id="modalMeta"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <a href="#contact" class="btn-signup" id="modalSignup">前往報名</a>
    </div>
  </dialog>

  <script>
    let allActivities = [];
    let categoryList = [];
    let currentCategory = "all";

    const grid = document.getElementById("cardGrid");
    const categoryNav = document.getElementById("categoryList");
    const modal = document.getElementById("detailModal");

    function renderCategoryButtons() {
      const buttons = [`<button class="category-btn ${currentCategory === "all" ? "active" : ""}" data-category="all">全部活動</button>`]
        .concat(categoryList.map(cat => `
          <button class="category-btn ${currentCategory === cat ? "active" : ""}" data-category="${cat}">${cat}</button>
        `));
      categoryNav.innerHTML = buttons.join("");
    }

    function renderActivities(filter) {
      currentCategory = filter;
      renderCategoryButtons();

      if (allActivities.length === 0) {
        grid.innerHTML = `<p class="empty-state">目前尚無活動資料，敬請期待新活動公告！</p>`;
        return;
      }

      const filtered = allActivities.filter(a => filter === "all" || a.category === filter);

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="empty-state">此分類目前尚無活動。</p>`;
        return;
      }

      grid.innerHTML = filtered.map(a => `
        <button class="activity-card" data-id="${a.id}">
          <div class="card-pic">${a.img ? `<img src="${a.img}" alt="${a.title || ""}">` : ""}</div>
          <div class="card-body">
            <span class="card-tag">${a.category || ""}</span>
            <div class="card-name">${a.title || "（未命名活動）"}</div>
            <div class="card-date">${a.date || ""}</div>
          </div>
        </button>
      `).join("");

      grid.querySelectorAll(".activity-card").forEach(card => {
        card.addEventListener("click", () => openModal(card.dataset.id));
      });
    }

    function openModal(id) {
      const a = allActivities.find(x => String(x.id) === String(id));
      if (!a) return;

      const picWrap = document.getElementById("modalPicWrap");
      if (a.img) {
        picWrap.style.display = "";
        document.getElementById("modalImg").src = a.img;
        document.getElementById("modalImg").alt = a.title || "";
      } else {
        picWrap.style.display = "none";
      }

      document.getElementById("modalTag").textContent = a.category || "";
      document.getElementById("modalName").textContent = a.title || "（未命名活動）";
      document.getElementById("modalMeta").textContent = [a.date, a.location].filter(Boolean).join("　|　");
      document.getElementById("modalDesc").textContent = a.description || "";

      const signupBtn = document.getElementById("modalSignup");
      if (a.link) {
        signupBtn.href = a.link;
        signupBtn.target = "_blank";
        signupBtn.rel = "noopener noreferrer";
        signupBtn.style.display = "inline-block";
      } else {
        signupBtn.style.display = "none";
      }

      modal.showModal();
    }

    document.getElementById("modalClose").addEventListener("click", () => modal.close());
    modal.addEventListener("click", (e) => {
      const rect = modal.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right
                   && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (!inside) modal.close();
    });

    categoryNav.addEventListener("click", (e) => {
      const btn = e.target.closest(".category-btn");
      if (!btn) return;
      renderActivities(btn.dataset.category);
    });
    
    renderActivities("all");

    async function loadActivities() {
      try {
        const res = await fetch("site-data.json", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          allActivities = Array.isArray(data.activities) ? data.activities : [];
          categoryList = Array.isArray(data.activityCategories) ? data.activityCategories : [];
        }
      } catch (err) {
        console.warn("無法載入 site-data.json，目前顯示的是空狀態畫面。", err);
      }
      renderActivities(currentCategory);
    }
    loadActivities();
  </script>
  <script src="footer.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDGoC CSMU</title>
  <style>
    /* 請複製 index.html 的共用樣式 (如 :root, header, nav 等) */
    /* ... 共用 CSS 略 ... */

    /* 課程卡片區塊 */
    .courses-section { padding: 80px 8%; }
    .courses-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 30px; 
    }
    
    .course-card {
      position: relative; /* 為了讓隱藏內容絕對定位 */
      background: #fff;
      border: 1px solid var(--border-color);
      height: 250px;
      overflow: hidden; /* 隱藏溢出的內容 */
      cursor: default;
    }
    
    /* 預設顯示的簡略內容 */
    .course-summary {
      padding: 30px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity 0.3s;
    }
    
    .course-summary h3 { margin-bottom: 15px; color: var(--heading-dark); }
    
    /* 滑鼠 Hover 時浮現的完整內容 */
    .course-details {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--blue-accent);
      color: white;
      padding: 30px;
      opacity: 0; /* 預設隱藏 */
      transform: translateY(20px); /* 稍微往下移 */
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    /* Hover 觸發效果 */
    .course-card:hover .course-summary { opacity: 0; } /* 隱藏原內容 */
    .course-card:hover .course-details { 
      opacity: 1; 
      transform: translateY(0); /* 歸位浮現 */
    }
  </style>
</head>
<body>
  <!-- Header 導覽列 -->
  <header>
    <div class="logo"><a href="index.html">AI與開源資訊社(´・ω・`)</a></div>
    <nav>
      <a href="about.html">About</a>
      <a href="courses.html" class="active">Courses</a> <!-- active 在這裡 -->
      <a href="activities.html">Activities</a>
    </nav>
  </header>

  <section class="courses-section">
    <h2 style="margin-bottom: 40px;">Our Courses</h2>
    <div class="courses-grid">
      <!-- 卡片 1 -->
      <div class="course-card">
        <div class="course-summary">
          <h3>網頁前端基礎</h3>
          <p>HTML, CSS, JavaScript 入門。</p>
        </div>
        <div class="course-details">
          <h3 style="margin-bottom: 10px; color: white;">網頁前端基礎</h3>
          <p style="font-size: 0.9rem;">這門課將帶你從零開始，學習如何建構網頁結構、美化版面，並加入簡單的互動效果。適合完全沒有程式基礎的同學。</p>
        </div>
      </div>
      
      <!-- 卡片 2 -->
      <div class="course-card">
        <div class="course-summary">
          <h3>Python 資料爬蟲</h3>
          <p>學習擷取網路資料。</p>
        </div>
        <div class="course-details">
          <h3 style="margin-bottom: 10px; color: white;">Python 資料爬蟲</h3>
          <p style="font-size: 0.9rem;">使用 Requests 和 BeautifulSoup 等套件，教你如何自動化收集網頁上的公開資訊，並進行初步的資料整理。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer 頁尾 (同 index.html) -->
</body>
</html>

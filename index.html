<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDGoC CSMU</title>
  <style>
    :root {
      --bg-light: #f8f9fa;
      --heading-dark: #211510;
      --text-gray: #555555;
      --blue-accent: #0073e6;
      --border-color: #e0e0e0;
      --footer-bg: #2b2b2b;
      --footer-text: #f0f0f0;
      --footer-text-muted: #a8a8a8;
      --footer-border: #3f3f3f;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      box-shadow: none !important;
    }

    body { background-color: #ffffff; color: var(--heading-dark); line-height: 1.5; }

    /* Header 導覽列 */
    header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 8%; border-bottom: 1px solid var(--border-color);
      background: #ffffff;
    }
    .logo a { font-weight: 700; font-size: 1.15rem; letter-spacing: 0.5px; color: var(--heading-dark); text-decoration: none; }
    nav { display: flex; gap: 24px; }
    nav a { text-decoration: none; color: var(--heading-dark); font-size: 0.95rem; font-weight: 500; }
    nav a:hover, nav a.active { color: var(--blue-accent); }

    /* Hero 主視覺區塊 */
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 50px 8%; align-items: start; }
    .hero-left h1 { font-size: 3.2rem; line-height: 1.08; font-weight: 800; margin-bottom: 20px;
      color: var(--heading-dark); letter-spacing: -0.5px; white-space: pre-line; }
    .hero-left .subtitle { color: var(--text-gray); font-size: 1rem; font-weight: 500; margin-bottom: 30px; }
    .btn-contact {
      padding: 10px 32px; background-color: var(--blue-accent); color: white; border: none; border-radius: 0px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
    }

    /* 點點矩陣背景與散落照片（照片來自 site-data.json，無資料時只顯示點狀背景，不留破圖） */
    .scatter-grid {
      position: relative; width: 100%; height: 420px;
      background-image: radial-gradient(#aaa 1.5px, transparent 1.5px);
      background-size: 40px 40px; background-position: 0 0;
    }
    .photo-card { position: absolute; width: 80px; height: 80px; overflow: hidden; border: none; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-1 { top: 40px;  left: 120px; }
    .photo-2 { top: 120px; left: 360px; }
    .photo-3 { top: 240px; left: 0px;   }
    .photo-4 { top: 240px; left: 280px; }

    /* 通用區塊與輪播 */
    .section-padding { padding: 70px 8%; }
    .slider-wrapper { position: relative; max-width: 900px; margin: 0 auto; }
    .card-container { display: flex; background-color: #0c1829; color: white; min-height: 300px; }
    .card-img { width: 45%; object-fit: cover; }
    .card-content { width: 55%; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    .slider-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 80px; border: 1px solid var(--border-color); font-size: 1.2rem;
      cursor: pointer; background: #ffffff; color: #333333; z-index: 10;
    }
    .slider-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .slider-btn-left { left: -20px; }
    .slider-btn-right { right: -20px; }
    .card-container.empty-state {
      align-items: center; justify-content: center; text-align: center; padding: 40px;
    }
    .card-container.empty-state p { color: rgba(255,255,255,0.75); font-size: 0.95rem; }

    /* 社團日曆區塊 */
    .calendar-container {
      max-width: 900px; margin: 30px auto 0; background: #fff;
      overflow: hidden; border: 1px solid var(--border-color);
    }
    .calendar-iframe { width: 100%; height: 480px; border: 0; }
    .btn-google-cal {
      display: inline-block; margin-top: 20px; padding: 10px 20px;
      background-color: var(--heading-dark); color: white; text-decoration: none;
      font-weight: 600; font-size: 0.9rem;
    }

    /* Footer 頁尾 */
    footer {
      background-color: var(--footer-bg); color: var(--footer-text);
      padding: 50px 8% 30px; border-top: 1px solid var(--footer-border); font-size: 0.95rem;
    }
    .footer-main { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 40px; align-items: center; margin-bottom: 50px; }
    .footer-left p { margin-bottom: 6px; }
    .footer-left .footer-address { color: var(--footer-text-muted); font-size: 0.9rem; margin-top: 10px; }

    /* 社群圖示容器（取代原本的 Privacy Policy 等法律連結位置） */
    .footer-center { display: flex; }
    .social-links-row { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .social-links-row a { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .social-links-row img {
      width: 24px; height: 24px; object-fit: contain;
      filter: brightness(0.8) grayscale(100%);
      transition: all 0.2s;
    }
    .social-links-row a:hover img { filter: brightness(1.15) grayscale(0%); }
    /* 圖片載入失敗時（路徑錯誤、檔案被刪除）JS 會加上這個 class 並改顯示文字，避免破圖 */
    .social-links-row a.icon-fallback span {
      color: var(--footer-text); font-size: 0.85rem; font-weight: 600;
    }
    .social-links-row a.icon-fallback:hover span { color: var(--blue-accent); }

    .footer-right { text-align: right; }
    .btn-back-top { background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--footer-text); }
    .footer-copyright { border-top: 1px solid #444444; padding-top: 20px; text-align: center; font-size: 0.85rem; color: var(--footer-text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html">AI與開源資訊社(´・ω・`)</a></div>
    <nav>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="activities.html">Activities</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-left">
      <h1 id="heroTitle">Developer Student Clubs
on CSMU</h1>
      <div class="subtitle" id="heroSubtitle">中山醫學大學 AI與開源資訊社</div>
      <a href="#contact" class="btn-contact">Contact Us</a>
    </div>

    <div class="scatter-grid" id="scatterGrid"></div>
  </section>

  <section class="section-padding">
    <h2 style="font-size: 1.8rem; margin-bottom: 30px; color: var(--heading-dark);">關於我們的社團特色</h2>
    <div class="slider-wrapper">
      <button class="slider-btn slider-btn-left" id="prevBtn" onclick="prevCard()">&lt;</button>
      <div class="card-container" id="cardContainer"></div>
      <button class="slider-btn slider-btn-right" id="nextBtn" onclick="nextCard()">&gt;</button>
    </div>
  </section>

  <section class="section-padding" style="background-color: var(--bg-light); text-align: center;">
    <p style="color: var(--text-gray);">歡迎查閱最新的社課、工作坊與活動安排</p>

    <div class="calendar-container">
      <iframe class="calendar-iframe" src="https://calendar.google.com/calendar/embed?src=dsccsmu%40gmail.com&ctz=Asia%2FTaipei"></iframe>
    </div>

    <a href="https://calendar.google.com/calendar/u/0/r?cid=dsccsmu@gmail.com" target="_blank" class="btn-google-cal">在 Google Calendar 中開啟</a>
  </section>

  <footer id="contact">
    <div class="footer-main">
      <div class="footer-left">
        <p id="footerEmail">dsccsmu@gmail.com</p>
        <p id="footerAddress" class="footer-address">Taichung, Taiwan</p>
      </div>

      <div class="footer-center">
        <div id="social-links-container" class="social-links-row"></div>
      </div>

      <div class="footer-right">
        <button class="btn-back-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">↑</button>
      </div>
    </div>

    <div class="footer-copyright">&copy; 2026 by CSMU GDGoC</div>
  </footer>

  <script>
    let flashCards = [];
    let currentIndex = 0;

    function renderScatterGrid(images) {
      const grid = document.getElementById("scatterGrid");
      if (!Array.isArray(images) || images.length === 0) {
        grid.innerHTML = "";
        return;
      }
      const positions = ["photo-1", "photo-2", "photo-3", "photo-4"];
      grid.innerHTML = images.slice(0, 4).map((img, i) => `
        <div class="photo-card ${positions[i] || ""}">
          <img src="${img.url}" alt="社團照片">
        </div>
      `).join("");
    }

    function renderCard() {
      const container = document.getElementById("cardContainer");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      if (flashCards.length === 0) {
        container.classList.add("empty-state");
        container.innerHTML = `<p>目前尚無社團特色卡片，敬請期待內容上線！</p>`;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      container.classList.remove("empty-state");
      prevBtn.disabled = false;
      nextBtn.disabled = false;

      const card = flashCards[currentIndex];
      container.innerHTML = `
        ${card.img ? `<img class="card-img" src="${card.img}">` : ""}
        <div class="card-content" style="${card.img ? "" : "width:100%;"}">
          <h3 style="margin-bottom:12px;">${card.title || "（未命名）"}</h3>
          <p style="opacity:0.85; line-height:1.6; font-size:0.95rem; white-space:pre-line;">${card.desc || ""}</p>
        </div>`;
    }
    function nextCard() {
      if (flashCards.length === 0) return;
      currentIndex = (currentIndex + 1) % flashCards.length;
      renderCard();
    }
    function prevCard() {
      if (flashCards.length === 0) return;
      currentIndex = (currentIndex - 1 + flashCards.length) % flashCards.length;
      renderCard();
    }
    renderCard();

    async function loadSiteContent() {
      try {
        const res = await fetch("site-data.json", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();

        if (data.home && data.home.banner) {
          if (data.home.banner.title) document.getElementById("heroTitle").textContent = data.home.banner.title;
          if (data.home.banner.subtitle) document.getElementById("heroSubtitle").textContent = data.home.banner.subtitle;
          renderScatterGrid(data.home.banner.images);
        }

        if (data.home && Array.isArray(data.home.flashCards)) {
          flashCards = data.home.flashCards;
          currentIndex = 0;
          renderCard();
        }
      } catch (err) {
        console.warn("無法載入 site-data.json，目前顯示的是頁面內建的預設內容。", err);
      }
    }
    loadSiteContent();
  </script>
  <script src="footer.js?v=3"></script>
</body>
</html>

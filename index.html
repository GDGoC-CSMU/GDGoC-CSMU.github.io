<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDGoC CSMU - 社團首頁</title>
  <style>
    /* 全局變數 */
    :root {
      --bg-light: #f8f9fa;
      --navy-dark: #0b1a30;
      --text-dark: #212529;
      --text-gray: #6c757d;
      --blue-accent: #0066cc;
      --border-color: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: #ffffff; color: var(--text-dark); line-height: 1.6; }

    /* 固定頁首導覽列 */
    header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 8%; border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    }
    .logo { font-weight: 800; font-size: 1.2rem; }
    nav a { margin: 0 15px; text-decoration: none; color: var(--text-dark); font-weight: 500; transition: color 0.2s; }
    nav a:hover, nav a.active { color: var(--blue-accent); font-weight: 700; }

    /* Hero 區塊 */
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 60px 8%; align-items: start; }
    .hero-left h1 { font-size: 3rem; line-height: 1.15; font-weight: 800; margin-bottom: 15px; }
    .hero-left .subtitle { color: var(--blue-accent); font-size: 1.2rem; font-weight: 600; margin-bottom: 30px; }
    .btn-contact { padding: 12px 28px; background-color: var(--blue-accent); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }

    /* Bento Grid */
    .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 180px); gap: 12px; }
    .bento-item { border-radius: 12px; overflow: hidden; background-color: #eee; }
    .bento-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: filter 0.3s; }
    .bento-item img:hover { filter: grayscale(0%); }
    .bento-1 { grid-column: 1 / 2; grid-row: 1 / 2; }
    .bento-2 { grid-column: 1 / 2; grid-row: 2 / 3; }
    .bento-3 { grid-column: 2 / 3; grid-row: 1 / 3; }
    .bento-4 { grid-column: 3 / 4; grid-row: 1 / 2; }
    .bento-5 { grid-column: 3 / 4; grid-row: 2 / 3; }

    /* 社團特色輪播 */
    .section-padding { padding: 80px 8%; }
    .slider-wrapper { position: relative; max-width: 900px; margin: 0 auto; }
    .card-container { display: flex; border-radius: 16px; overflow: hidden; background-color: var(--navy-dark); color: white; min-height: 320px; }
    .card-img { width: 45%; object-fit: cover; }
    .card-content { width: 55%; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 90px; border: none; font-size: 1.5rem; font-weight: bold; cursor: pointer; background: #fff; color: #333; z-index: 10; }
    .slider-btn-left { left: -21px; box-shadow: 2px 0 10px rgba(0,0,0,0.15); border-radius: 6px 0 0 6px; }
    .slider-btn-right { right: -21px; box-shadow: -2px 0 10px rgba(0,0,0,0.15); border-radius: 0 6px 6px 0; }

    /* Footer */
    footer { background-color: #f1f3f5; padding: 50px 8% 20px; border-top: 1px solid var(--border-color); }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-bottom: 40px; }
  </style>
</head>
<body>

  <!-- 導覽列：透過實體檔案連結切換 -->
  <header>
    <div class="logo">GDGoC CSMU</div>
    <nav>
      <a href="index.html" class="active">About (首頁)</a>
      <a href="courses.html">Courses (課程分類)</a>
      <a href="activities.html">Activities (社團活動)</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-left">
      <h1>Developer<br>Student Clubs<br>on CSMU</h1>
      <div class="subtitle">中山醫學大學 AI與開源資訊社</div>
      <a href="activities.html" class="btn-contact">探索社團活動</a>
    </div>
    
    <div class="bento-grid">
      <div class="bento-item bento-1"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500" alt="1"></div>
      <div class="bento-item bento-2"><img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500" alt="2"></div>
      <div class="bento-item bento-3"><img src="https://images.unsplash.com/photo-1477959858617-67f30ac4ce71?w=500" alt="3"></div>
      <div class="bento-item bento-4"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="4"></div>
      <div class="bento-item bento-5"><img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=500" alt="5"></div>
    </div>
  </section>

  <section class="section-padding">
    <h2 style="font-size: 1.8rem; margin-bottom: 30px;">關於我們的社團特色</h2>
    <div class="slider-wrapper">
      <button class="slider-btn slider-btn-left" onclick="prevCard()">&lt;</button>
      <div class="card-container" id="cardContainer"></div>
      <button class="slider-btn slider-btn-right" onclick="nextCard()">&gt;</button>
    </div>
  </section>

  <footer>
    <div class="footer-grid">
      <div>
        <h4>Contact Info</h4>
        <p>📧 dsccsmu@gmail.com</p>
        <p>📍 中山醫學大學 校區社團教室</p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <p><a href="courses.html" style="color:#6c757d; text-decoration:none;">查看社團課程</a></p>
        <p><a href="activities.html" style="color:#6c757d; text-decoration:none;">檢視活動行事曆</a></p>
      </div>
    </div>
    <div style="text-align:center; color:#6c757d; font-size:0.85rem;">&copy; 2026 GDGoC CSMU</div>
  </footer>

  <script>
    /* 1. 社團特色輪播資料庫 */
    const clubCards = [
      { img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600", title: "跨領域學習與技術交流", desc: "不論來自什麼科系，都能從零基礎踏入程式開發與 AI 領域。" },
      { img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=600", title: "實作導向工作坊", desc: "注重動手實作，每堂社課都有專案，幫你累積實務作品集。" },
      { img: "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=600", title: "開源社群資源共享", desc: "串聯業界與開源社群資源，獲取第一手實習與專案合作機會。" }
    ];
    let currentIndex = 0;
    function renderCard() {
      const card = clubCards[currentIndex];
      document.getElementById("cardContainer").innerHTML = `
        <img class="card-img" src="${card.img}">
        <div class="card-content">
          <h3 style="margin-bottom:12px;">${card.title}</h3>
          <p style="opacity:0.9; line-height:1.6;">${card.desc}</p>
        </div>`;
    }
    function nextCard() { currentIndex = (currentIndex + 1) % clubCards.length; renderCard(); }
    function prevCard() { currentIndex = (currentIndex - 1 + clubCards.length) % clubCards.length; renderCard(); }
    renderCard();
  </script>
</body>
</html>
